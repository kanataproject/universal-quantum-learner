name: Purge History
on: workflow_dispatch

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Purge specific core files and folder from history
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 過去の全履歴から対象のフォルダと特定のファイルをピンポイントで強制削除
          git filter-branch --force --index-filter \
            "git rm -r --cached --ignore-unmatch for_gpu *test_Opt_gpu.py *quantum_classifier_gpu.py" \
            --prune-empty --tag-name-filter cat -- --all
          
          # 変更された歴史を同じURLへ強制上書きプッシュ
          git push origin --force --all
